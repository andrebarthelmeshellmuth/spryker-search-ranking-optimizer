name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: composer validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --no-check-publish

  style:
    name: phpcs (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpcs

  rector:
    # Dry run only, never writes to the working tree — guards against regressions on rules already
    # vetted for this codebase (see rector.php's own comments for what's skipped and why).
    name: rector (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # opcache.enable_cli must be off: when on, Rector's BetterReflection-based autoloading
          # silently fails to parse EVERY file in this project (confirmed empirically) instead of
          # erroring cleanly — explicit here rather than trusting the runner's PHP build default.
          ini-values: opcache.enable_cli=0
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer rector-dry-run

  floors:
    # The check that matters most for this package. Its dependency floors are claims about which
    # versions of search-ranking (and Spryker itself) an adopter may install; a shop leaner than the
    # development shop is exactly where an undeclared dependency surfaces, and that cannot be observed
    # while developing inside a full demo shop. This resolves every constraint to its oldest allowed
    # version and asserts each vendor symbol used in src/ actually exists there.
    name: dependency floors (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer check-floors

  phpstan:
    # Standalone CI variant (`composer phpstan-ci`, see phpstan.ci.neon) — generates just the Transfer
    # classes this package needs (same generator the Portable suite below uses) and ignores the two
    # categories of class that only exist inside a real host shop (Propel Orm\Zed\* models, the
    # aggregated Ide\AutoCompletion stub). The full host-shop-aware `composer phpstan` check still runs
    # from within a real project — see README, "Testing and CI".
    name: phpstan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer phpstan-ci

  portable-tests:
    # Runs this package's own tests, standalone — no demoshop, no live database, no Elasticsearch.
    # `@group Portable` (tests/_ci-standalone/) is the subset that needs only `Generated\Shared\Transfer\*`,
    # generated here via a direct TransferBusinessFactory call rather than the full Zed Console/Kernel
    # bootstrap. `@group NeedsDatabase`/`@group NeedsSearch` are NOT run here — they need a real project
    # (see the CI-portability write-up); run them from a host shop instead.
    #
    # tests/_ci-standalone/Generated/Shared/Search/PageIndexMap.php is a checked-in, point-in-time fixture,
    # not live-generated: its content is a project-wide aggregate across every installed sibling package,
    # so it cannot be produced by this package alone. See that file's own docblock for what it is and how
    # to regenerate it — regeneration is only needed when the project-wide search field set itself changes.
    name: portable tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php tests/_ci-standalone/generate-transfers.php
      - run: vendor/bin/codecept run -c tests/codeception.portable.yml -g Portable

  complexity:
    # Three SEPARATE phpmd runs, not one combined ruleset: PHPMD merges every loaded ruleset's
    # exclude-pattern into one global file-ignore list for a single invocation, so keeping each rule's
    # own Facade/Factory/Mapper exemption in its own ruleset (run on its own) is the only way to exempt
    # just that one rule without also hiding those files from the rules in the other rulesets.
    name: phpmd (codesize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpmd src github phpmd.xml
      - name: Public method count (Facades/Factories exempt)
        run: vendor/bin/phpmd src github phpmd-public-methods.xml
      - name: Parameter count (Facades/Mappers exempt)
        run: vendor/bin/phpmd src github phpmd-parameter-list.xml
